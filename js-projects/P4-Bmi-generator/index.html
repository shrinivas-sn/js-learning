<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Claculator</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
        <h1 class = "nav-bar">BMI Calculator using DOM Manipulation</h1><br>
        <div class = "form-div">
            <div>Persnol Detials</div>
            <form>
                <div class="input-form">
                    Name<br>
                    <input class = "form-input names" type = "text" placeholder="Enter your name"><br>
                </div>
                <div class="input-form">
                    Age<br>
                    <input class = "form-input age" type = "text" placeholder="Enter your age"><br>
                </div>                
                <div class="input-form">
                    Weight<br>
                    <input class = "form-input weight" type = "text" placeholder="Enter weight in KG"><br>
                </div>                
                <div class="input-form">
                    Height<br>
                    <input class = "form-input height" type = "text" placeholder="Enter height in CM"><br>
                </div>                
                <div class="input-form">
                    Step count<br>
                    <input class = "form-input step-count" type = "text" placeholder="Enter today''s step count"><br>
                </div>                
                <div class="input-form">
                    Sleep hours<br>
                    <input class = "form-input sleep-count" type = "text" placeholder="Enter today's Sleep hours"><br>
                </div><br>               
                <button class="button form-btn">Submit details</button>
            </form>
        </div>
    <div class="main-div">
        <pre class = "div-title"> BMI Calculator</pre>
        <div>Height in CM
            <div class="input">
                <input type = "text" id = "height" placeholder="Height">
            </div>
        </div><br>
        <div>Weight in KG
            <div class="input">
                <input type="text" id = "weight" placeholder="Weight">
            </div>
        </div><br>
        <button class="button">Calculate</button><br>

        <div id="results"></div>
        <div id = "evaluation"></div>
    </div>
    <script src = "script.js"></script>
</body>
</html>
