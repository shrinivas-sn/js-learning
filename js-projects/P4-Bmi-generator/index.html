<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Claculator</title>
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
    <h1 class = "nav-bar">BMI Calculator using DOM Manipulation</h1><br><br>
    <div class="main-div">
        <pre class = "div-title"> BMI Calculator</pre>
        <div>Height in CM
            <div class="input">
                <input type = "text" id = "height" placeholder="Height">
            </div>
        </div><br>
        <div>Weight in KG
            <div class="input">
                <input type="text" id = "weight" placeholder="Weight">
            </div>
        </div><br>
        <button class="button">Calculate</button><br>

        <div id="results"></div>
        <div id = "evaluation"></div>
    </div>
    <script src = "script.js"></script>
</body>
</html>
