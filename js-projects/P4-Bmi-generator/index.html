<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id = "title">BMI Claculator</title>
    <link rel="icon" type="png" href="calculator.png"> <!--this helps to add the logo of any website at the top of the tab-->
    <link rel = "stylesheet" href = "style.css">
</head>
<body>
        <h1 class = "nav-bar">BMI Calculator using DOM Manipulation</h1>
        <header class="header">
            <div class = "header-div">
                A Interactve Health Metrics Calculator page using DOM manipulation, Event Listeners, Modern ES6 topics
            </div>
        </header>
        <div class = "form-div">
            <div class = "form-title">Persnol Detials</div>
            <form>
                <div class="input-box">
                    Name<br>
                    <input class = "form-input" id = "name" type = "text" placeholder="Enter your name"><br>
                </div>
                <div class="input-box">
                    Gender<br>
                    <input class = "form-input" id = "gender" type = "text" placeholder="Enter your gender"><br>
                </div>
                <div class="input-box">
                    Age<br>
                    <input class = "form-input" id = "age" type = "text" placeholder="Enter your age"><br>
                </div>                
                <div class="input-box">
                    Weight<br>
                    <input class = "form-input" id = "form-weight" type = "text" placeholder="Enter weight in KG"><br>
                </div>                
                <div class="input-box">
                    Height<br>
                    <input class = "fotm-input" id = "form-height" type = "text" placeholder="Enter height in CM"><br>
                </div>                
                <div class="input-box">
                    Step count<br>
                    <input class = "form-input" id = "step-count" type = "text" placeholder="Enter today's step count"><br>
                </div>                
                <div class="input-box">
                    Sleep hours<br>
                    <input class = "form-input" id = "sleep-hours" type = "text" placeholder="Enter today's Sleep hours"><br>
                </div><br>               
                <button class="button form-btn">Submit details</button>
            </form>
        </div>
    <div class="main-div">
        <pre class = "div-title"> BMI Calculator</pre><br>
        <div class = "input-box">Height in CM
            <div class="calc-input">
                <input type = "text" id = "height" placeholder="Height">
            </div>
        </div><br>
        <div class = "input-box">Weight in KG
            <div class="calc-input">
                <input type="text" id = "weight" placeholder="Weight">
            </div>
        </div><br>
        <button class="calc-btn button">Calculate</button><br>
        <div id="results"></div><br>
        <div id = "evaluation"></div>
    </div>
    <div class="results-div">
        <div id = "bmi-result">
            <button class = "result-btn" id = "bmi-btn">Click here for BMI value</button><br>
            <span id = "bmi-span"></span>
        </div>
        <div id = "bmr-result">
            <button class = "result-btn" id = "bmr-btn">Click here for BMR value</button><br>
            <span id = "bmr-span"></span>
        </div>
        <div id = "sqc-result">
            <button class = "result-btn" id = "sqc-btn">Click here for SQC value</button><br>
                <span id = "sqc-span"></span>
        </div>
    </div>
    <script src = "script.js"></script>
</body>
</html>
