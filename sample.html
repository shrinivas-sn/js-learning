<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@tailwindcss/browser@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000; /* Black background */
            color: #fff; /* White text */
        }
        .edit-input {
            width: 100px;
            padding: 8px;
            border: 1px solid #555; /* Darker border for better visibility */
            border-radius: 4px;
            margin-left: 8px;
            font-size: 14px;
            background-color: #222; /* Darker input background */
            color: #fff; /* White text color */
        }
        .save-button {
            background-color: #4CAF50;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
            font-size: 14px;
        }
        .save-button:hover {
            background-color: #45a049;
        }
        .delete-button {
            background-color: #f44336;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 8px;
            font-size: 14px;
        }
        .delete-button:hover {
            background-color: #d32f2f;
        }
        .action-container {
            display: flex;
            gap: 8px;
            align-items: center; /* Vertically align items */
        }
        .data-transfer-buttons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 10px;
        }
        .data-transfer-button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        .data-transfer-button:hover {
            background-color: #0056b3;
        }
        .edit-mode {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        #itemTable {
            border-collapse: collapse;
            color: #fff;
        }
        #itemTable th,
        #itemTable td {
            border: 1px solid #555; /* Darker border */
            padding: 8px;
        }
        #itemTable th {
            background-color: #333; /* Darker header */
        }
        #itemTable tbody {
            color: #eee;
        }
        #noItemsMessage {
            color: #eee;
        }
    </style>
</head>
<body class="bg-gray-900 p-6 rounded-lg">
    <h1 class="text-3xl font-semibold text-center text-blue-400 mb-8">Inventory Management</h1>

    <div class="container mx-auto">
        <div class="bg-gray-800 shadow-md rounded-lg p-6">
            <div class="flex space-x-4 mb-4">
                <input
                    type="text"
                    id="search"
                    placeholder="Search by Item Name"
                    class="w-full rounded-md border-gray-700 bg-gray-800 text-white shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2"
                />
                <button onclick="searchItems()" class="bg-green-500 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md shadow-md focus:outline-none focus:shadow-outline">
                    Search
                </button>
            </div>

            <div class="overflow-x-auto">
                <table id="itemTable" class="min-w-full table-auto rounded-lg hidden">
                    <thead class="bg-gray-700">
                        <tr>
                            <th class="px-4 py-2 text-left text-gray-300 font-semibold uppercase">Item Name</th>
                            <th class="px-4 py-2 text-left text-gray-300 font-semibold uppercase">Quantity Available</th>
                            <th class="px-4 py-2 text-left text-gray-300 font-semibold uppercase">Action</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-700">
                    </tbody>
                </table>
            </div>

            <div id="noItemsMessage" class="text-center text-gray-400 py-4">No items found. Please add items to your inventory.</div>
        </div>

        <div class="bg-gray-800 shadow-md rounded-lg p-6 mt-8">
            <h2 class="text-2xl font-semibold text-gray-300 mb-6">Add New Item</h2>
            <form id="addItemForm" class="space-y-4">
                <div class="flex space-x-4">
                    <div class="flex-1">
                        <label for="itemName" class="block text-gray-400 text-sm font-bold mb-2">Item Name:</label>
                        <input type="text" id="itemName" placeholder="Enter Item Name" required
                               class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-gray-800 text-white border-gray-700" />
                    </div>
                    <div class="flex-1">
                        <label for="initialQuantity" class="block text-gray-400 text-sm font-bold mb-2">Initial Quantity:</label>
                        <input type="number" id="initialQuantity" placeholder="Enter Initial Quantity" required
                               class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline bg-gray-800 text-white border-gray-700" />
                    </div>
                </div>
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-md shadow-md focus:outline-none focus:shadow-outline">
                    Add Item
                </button>
            </form>
        </div>

        <div class="data-transfer-buttons">
            <button id="copyDataButton" class="data-transfer-button">Copy Data</button>
            <button id="uploadDataButton" class="data-transfer-button">Upload Data</button>
        </div>
    </div>

    <script>
        const itemTable = document.getElementById("itemTable");
        const noItemsMessage = document.getElementById("noItemsMessage");
        let items = [];

        if (localStorage.getItem("inventoryItems")) {
            items = JSON.parse(localStorage.getItem("inventoryItems"));
        }

        function displayItems() {
            // Sort items alphabetically by name
            items.sort((a, b) => a.name.localeCompare(b.name));

            const itemTableBody = itemTable.getElementsByTagName("tbody")[0];
            itemTableBody.innerHTML = "";

            if (items.length === 0) {
                itemTable.classList.add("hidden");
                noItemsMessage.classList.remove("hidden");
            } else {
                itemTable.classList.remove("hidden");
                noItemsMessage.classList.add("hidden");
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    const row = itemTableBody.insertRow();
                    const nameCell = row.insertCell();
                    const remainingQuantityCell = row.insertCell();
                    const actionCell = row.insertCell();

                    nameCell.textContent = item.name;
                    remainingQuantityCell.textContent = item.initialQuantity - (item.quantitySold || 0);

                    const actionDiv = document.createElement("div");
                    actionDiv.className = "action-container";

                    // Sell Button
                    const sellButton = document.createElement("button");
                    sellButton.textContent = "Sell";
                    sellButton.className = "bg-indigo-500 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md shadow-md focus:outline-none focus:shadow-outline";
                    sellButton.onclick = function() {
                        const quantity = prompt(`Enter quantity to sell for ${item.name}:`);
                        if (quantity !== null && quantity !== "") {
                            const parsedQuantity = parseInt(quantity);
                            if (!isNaN(parsedQuantity) && parsedQuantity > 0) {
                                if (!item.quantitySold) {
                                    item.quantitySold = 0;
                                }
                                if (parsedQuantity <= item.initialQuantity - item.quantitySold) {
                                    item.quantitySold += parsedQuantity;
                                    localStorage.setItem("inventoryItems", JSON.stringify(items));
                                    displayItems();
                                    if (item.initialQuantity - item.quantitySold === 0) {
                                        setTimeout(() => {
                                            alert(`Item ${item.name} is out of stock!`);
                                        }, 100);
                                    }
                                } else {
                                    alert("Insufficient stock!");
                                }
                            } else {
                                alert("Invalid quantity!");
                            }
                        }
                    };
                    actionDiv.appendChild(sellButton);

                    // NEW: Add Quantity Button
                    const addButton = document.createElement("button");
                    addButton.textContent = "Add";
                    addButton.className = "bg-teal-500 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-md shadow-md focus:outline-none focus:shadow-outline";
                    addButton.onclick = function() {
                        const quantity = prompt(`Enter quantity to add to ${item.name}:`);
                        if (quantity !== null && quantity !== "") {
                            const parsedQuantity = parseInt(quantity);
                            if (!isNaN(parsedQuantity) && parsedQuantity > 0) {
                                item.initialQuantity += parsedQuantity;
                                localStorage.setItem("inventoryItems", JSON.stringify(items));
                                displayItems();
                            } else {
                                alert("Invalid quantity!");
                            }
                        }
                    };
                    actionDiv.appendChild(addButton);

                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";
                    deleteButton.className = "delete-button";
                    deleteButton.onclick = function() {
                        const confirmation = confirm("Are you sure you want to delete this item?");
                        if (confirmation) {
                            items.splice(i, 1);
                            localStorage.setItem("inventoryItems", JSON.stringify(items));
                            displayItems();
                        }
                    };
                    actionDiv.appendChild(deleteButton);
                    actionCell.appendChild(actionDiv);

                    nameCell.addEventListener("click", () => {
                        const quantitySoldDisplay = document.createElement("div");
                        quantitySoldDisplay.textContent = `Quantity Sold: ${item.quantitySold || 0}`;
                        quantitySoldDisplay.className = "mb-2 text-white";

                        const nameInput = document.createElement("input");
                        nameInput.type = "text";
                        nameInput.value = item.name;
                        nameInput.className = "edit-input";

                        const quantityInput = document.createElement("input");
                        quantityInput.type = "number";
                        quantityInput.value = item.initialQuantity;
                        quantityInput.className = "edit-input";

                        const saveButton = document.createElement("button");
                        saveButton.textContent = "Save";
                        saveButton.className = "save-button";

                        const containerDiv = document.createElement("div");
                        containerDiv.className = "edit-mode";

                        containerDiv.appendChild(quantitySoldDisplay);
                        containerDiv.appendChild(nameInput);
                        containerDiv.appendChild(quantityInput);
                        containerDiv.appendChild(saveButton);
                        nameCell.innerHTML = "";
                        nameCell.appendChild(containerDiv);

                        saveButton.onclick = () => {
                            const newName = nameInput.value;
                            const newQuantity = parseInt(quantityInput.value);
                            if (newName.trim() !== "" && !isNaN(newQuantity) && newQuantity >= 0) {
                                const oldInitialQuantity = item.initialQuantity;
                                item.name = newName;
                                item.initialQuantity = newQuantity;
                                 if (newQuantity !== oldInitialQuantity) {
                                     item.quantitySold = 0; // Reset quantity sold only if initial quantity is changed
                                }
                                localStorage.setItem("inventoryItems", JSON.stringify(items));
                                displayItems();
                            } else {
                                alert("Invalid item name or quantity!");
                            }
                        };
                    });
                }
            }
        }

        function searchItems() {
            const searchInput = document.getElementById("search").value.toLowerCase();
            const filteredItems = items.filter(item => item.name.toLowerCase().startsWith(searchInput));
             // Sort filtered items alphabetically by name
            filteredItems.sort((a, b) => a.name.localeCompare(b.name));
            const itemTableBody = itemTable.getElementsByTagName("tbody")[0];
            itemTableBody.innerHTML = "";

            if (filteredItems.length === 0) {
                itemTable.classList.add("hidden");
                noItemsMessage.classList.remove("hidden");
            } else {
                itemTable.classList.remove("hidden");
                noItemsMessage.classList.add("hidden");
                for (let i = 0; i < filteredItems.length; i++) {
                    const item = filteredItems[i];
                    const row = itemTableBody.insertRow();
                    const nameCell = row.insertCell();
                    const remainingQuantityCell = row.insertCell();
                    const actionCell = row.insertCell();

                    nameCell.textContent = item.name;
                    remainingQuantityCell.textContent = item.initialQuantity - (item.quantitySold || 0);

                    const actionDiv = document.createElement("div");
                    actionDiv.className = "action-container";

                    const sellButton = document.createElement("button");
                    sellButton.textContent = "Sell";
                    sellButton.className = "bg-indigo-500 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md shadow-md focus:outline-none focus:shadow-outline";
                    sellButton.onclick = function() {
                        const quantity = prompt(`Enter quantity to sell for ${item.name}:`);
                        if (quantity !== null && quantity !== "") {
                            const parsedQuantity = parseInt(quantity);
                            if (!isNaN(parsedQuantity) && parsedQuantity > 0) {
                                if (!item.quantitySold) {
                                    item.quantitySold = 0;
                                }
                                if (parsedQuantity <= item.initialQuantity - item.quantitySold) {
                                    item.quantitySold += parsedQuantity;
                                    localStorage.setItem("inventoryItems", JSON.stringify(items));
                                    displayItems();
                                    if (item.initialQuantity - item.quantitySold === 0) {
                                        setTimeout(() => {
                                            alert(`Item ${item.name} is out of stock!`);
                                        }, 100);
                                    }
                                } else {
                                    alert("Insufficient stock!");
                                }
                            } else {
                                alert("Invalid quantity!");
                            }
                        }
                    };
                    actionDiv.appendChild(sellButton);

                    // Add Button in search view
                    const addButton = document.createElement("button");
                    addButton.textContent = "Add";
                    addButton.className = "bg-teal-500 hover:bg-teal-700 text-white font-bold py-2 px-4 rounded-md shadow-md focus:outline-none focus:shadow-outline";
                    addButton.onclick = function() {
                        const quantity = prompt(`Enter quantity to add to ${item.name}:`);
                        if (quantity !== null && quantity !== "") {
                            const parsedQuantity = parseInt(quantity);
                            if (!isNaN(parsedQuantity) && parsedQuantity > 0) {
                                item.initialQuantity += parsedQuantity;
                                localStorage.setItem("inventoryItems", JSON.stringify(items));
                                displayItems();
                            } else {
                                alert("Invalid quantity!");
                            }
                        }
                    };
                    actionDiv.appendChild(addButton);

                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";
                    deleteButton.className = "delete-button";
                    deleteButton.onclick = function() {
                        const confirmation = confirm("Are you sure you want to delete this item?");
                        if (confirmation) {
                            items.splice(i, 1);
                            localStorage.setItem("inventoryItems", JSON.stringify(items));
                            displayItems();
                        }
                    };
                    actionDiv.appendChild(deleteButton);
                    actionCell.appendChild(actionDiv);

                    nameCell.addEventListener("click", () => {
                        const quantitySoldDisplay = document.createElement("div");
                        quantitySoldDisplay.textContent = `Quantity Sold: ${item.quantitySold || 0}`;
                        quantitySoldDisplay.className = "mb-2 text-white";

                        const nameInput = document.createElement("input");
                        nameInput.type = "text";
                        nameInput.value = item.name;
                        nameInput.className = "edit-input";

                        const quantityInput = document.createElement("input");
                        quantityInput.type = "number";
                        quantityInput.value = item.initialQuantity;
                        quantityInput.className = "edit-input";

                        const saveButton = document.createElement("button");
                        saveButton.textContent = "Save";
                        saveButton.className = "save-button";

                        const containerDiv = document.createElement("div");
                        containerDiv.className = "edit-mode";

                        containerDiv.appendChild(quantitySoldDisplay);
                        containerDiv.appendChild(nameInput);
                        containerDiv.appendChild(quantityInput);
                        containerDiv.appendChild(saveButton);
                        nameCell.innerHTML = "";
                        nameCell.appendChild(containerDiv);

                        saveButton.onclick = () => {
                            const newName = nameInput.value;
                            const newQuantity = parseInt(quantityInput.value);
                            if (newName.trim() !== "" && !isNaN(newQuantity) && newQuantity >= 0) {
                                const oldInitialQuantity = item.initialQuantity;
                                item.name = newName;
                                item.initialQuantity = newQuantity;
                                 if (newQuantity !== oldInitialQuantity) {
                                     item.quantitySold = 0; // Reset quantity sold only if initial quantity is changed
                                }
                                localStorage.setItem("inventoryItems", JSON.stringify(items));
                                displayItems();
                            } else {
                                alert("Invalid item name or quantity!");
                            }
                        };
                    });
                }
            }
        }

        const addItemForm = document.getElementById("addItemForm");
        addItemForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const itemName = document.getElementById("itemName").value;
            const initialQuantity = parseInt(document.getElementById("initialQuantity").value);

            if (itemName.trim() === "" || isNaN(initialQuantity) || initialQuantity <= 0) {
                alert("Please enter valid item name and initial quantity.");
                return;
            }

            const newItem = {
                name: itemName,
                initialQuantity: initialQuantity,
                quantitySold: 0
            };

            items.push(newItem);
            localStorage.setItem("inventoryItems", JSON.stringify(items));
            displayItems();
            addItemForm.reset();
        });

        document.getElementById('copyDataButton').addEventListener('click', function() {
            const dataToCopy = JSON.stringify(items);
            // Use fallback copy method as requested in instructions for environment compatibility
            const textArea = document.createElement("textarea");
            textArea.value = dataToCopy;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                alert('Data copied to clipboard! You can now paste it on another device.');
            } catch (err) {
                alert('Failed to copy data. Please copy manually.');
            }
            document.body.removeChild(textArea);
        });

        document.getElementById('uploadDataButton').addEventListener('click', function() {
            const dataToUpload = prompt('Paste the inventory data here:');
            if (dataToUpload) {
                try {
                    const parsedData = JSON.parse(dataToUpload);
                    if (Array.isArray(parsedData)) {
                        items = parsedData;
                        localStorage.setItem('inventoryItems', JSON.stringify(items));
                        displayItems();
                        alert('Data uploaded successfully!');
                    } else {
                        alert('Invalid data format. Please paste valid inventory data.');
                    }
                } catch (e) {
                    alert('Invalid data format. Please paste valid inventory data.');
                }
            } else {
                alert('No data provided. Please paste the inventory data to upload.');
            }
        });

        const searchInput = document.getElementById('search');
        searchInput.addEventListener('input', searchItems); // Listen for input changes

        displayItems();
    </script>
</body>
</html>
